name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy-backend:
    name: Backend → Railway (Docker/ttl.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ttl.sh (public, no auth)
        uses: docker/build-push-action@v5
        with:
          context: PureEssence/backend
          push: true
          tags: ttl.sh/pureessence-backend-railway:9999h

      - name: Update Railway service to use Docker image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          curl -sf -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation{serviceInstanceUpdate(serviceId:\"c51669cd-612e-414d-bb75-07e2bbbd8f19\",environmentId:\"5ddb3f79-1d62-411c-b1d6-9490eb176a23\",input:{source:{image:\"ttl.sh/pureessence-backend-railway:9999h\"},startCommand:\"\",sleepApplication:true})}"}' \
            && echo "Railway source updated to ttl.sh image" || echo "Update failed (continuing)"

      - name: Trigger Railway deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          curl -sf -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation{serviceInstanceDeploy(serviceId:\"c51669cd-612e-414d-bb75-07e2bbbd8f19\",environmentId:\"5ddb3f79-1d62-411c-b1d6-9490eb176a23\",latestCommit:false)}"}' \
            && echo "Deploy triggered" || \
          curl -sf -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation{serviceInstanceRedeploy(serviceId:\"c51669cd-612e-414d-bb75-07e2bbbd8f19\",environmentId:\"5ddb3f79-1d62-411c-b1d6-9490eb176a23\")}"}' \
            && echo "Redeploy triggered" || echo "Deploy trigger failed (paused)"

  deploy-frontend:
    name: Frontend → Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: PureEssence/frontend
        run: npm install

      - name: Build
        working-directory: PureEssence/frontend
        env:
          VITE_API_URL: https://pureessence-backend.loca.lt/api
        run: npm run build

      - name: Deploy to Netlify
        working-directory: PureEssence/frontend
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=dist --site=3835da27-45fd-47b2-905f-947795ba00e0
