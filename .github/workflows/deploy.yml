name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy-backend:
    name: Backend → Railway
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway deploy from GitHub
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          curl -sf -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation{githubRepoDeploy(input:{projectId:\"13ada8b7-ae82-4269-a045-ab200e209f28\",repo:\"diegom0yacampo/pureessence\",branch:\"master\"})}"}' \
            --max-time 30 || echo "Deploy triggered (response timeout OK)"

  deploy-frontend:
    name: Frontend → Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: PureEssence/frontend
        run: npm install

      - name: Build
        working-directory: PureEssence/frontend
        env:
          VITE_API_URL: https://pureessence-backend-production-edb9.up.railway.app/api
        run: npm run build

      - name: Deploy to Netlify
        working-directory: PureEssence/frontend
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=dist --site=3835da27-45fd-47b2-905f-947795ba00e0
