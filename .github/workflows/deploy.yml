name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: PureEssence/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: PureEssence/frontend

      - name: Build
        run: npm run build
        working-directory: PureEssence/frontend

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html
        working-directory: PureEssence/frontend

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./PureEssence/frontend/dist
