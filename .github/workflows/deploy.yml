name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy-backend:
    name: Backend → Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: PureEssence/backend
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 13ada8b7-ae82-4269-a045-ab200e209f28
          RAILWAY_SERVICE_ID: 4eb35883-0bbf-49cd-909a-51a76615fb1b
          RAILWAY_ENVIRONMENT_ID: 5ddb3f79-1d62-411c-b1d6-9490eb176a23
        run: railway up --detach

  deploy-frontend:
    name: Frontend → Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: PureEssence/frontend
        run: npm install

      - name: Build
        working-directory: PureEssence/frontend
        env:
          VITE_API_URL: https://pureessence-backend-production-edb9.up.railway.app/api
        run: npm run build

      - name: Deploy to Netlify
        working-directory: PureEssence/frontend
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=dist --site=3835da27-45fd-47b2-905f-947795ba00e0
