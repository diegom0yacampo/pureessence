name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy-backend:
    name: Backend → Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: PureEssence/backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service pureessence-backend --detach

  deploy-frontend:
    name: Frontend → Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PureEssence/frontend/package-lock.json

      - name: Install dependencies
        working-directory: PureEssence/frontend
        run: npm ci

      - name: Build
        working-directory: PureEssence/frontend
        env:
          VITE_API_URL: https://pureessence-backend-production-edb9.up.railway.app/api
        run: npm run build

      - name: Deploy to Netlify
        working-directory: PureEssence/frontend
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=dist --site=3835da27-45fd-47b2-905f-947795ba00e0
