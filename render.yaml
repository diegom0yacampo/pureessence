services:
  - type: web
    name: pureessence-backend
    env: node
    plan: free
    buildCommand: "cd PureEssence/backend && npm install && npm run build"
    startCommand: "cd PureEssence/backend && npm start"
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: pureessence-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pureessence-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pureessence-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: pureessence-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pureessence-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_AI_KEY
        sync: false
      - key: FRONTEND_URL
        value: "https://pureessence-frontend.onrender.com"

  - type: web
    name: pureessence-frontend
    env: static
    buildCommand: "cd PureEssence/frontend && npm install && npm run build"
    staticPublishPath: "PureEssence/frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://pureessence-backend.onrender.com/api"

databases:
  - name: pureessence-db
    databaseName: pureessence
    user: pureessence_user
    plan: free
