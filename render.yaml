services:
  - type: web
    name: pureessence-backend
    env: node
    plan: free
    buildCommand: "cd PureEssence/backend && npm install && npm run build"
    startCommand: "cd PureEssence/backend && npm start"
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "tienda_db"
      - key: DB_USER
        value: "postgres"
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_AI_KEY
        sync: false
      - key: FRONTEND_URL
        value: "https://pureessence-frontend.onrender.com"

  - type: web
    name: pureessence-frontend
    env: static
    buildCommand: "cd PureEssence/frontend && npm install && npm run build"
    staticPublishPath: "PureEssence/frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://pureessence-backend-uiet.onrender.com/api"
